# Global mise config (~/.config/mise/config.toml).
# Per-project versions live in each repo's own .mise.toml and override these.
[tools]
coursier = "2.1.24"
java = "openjdk-21.0.2"
node = "22.21.1"
python = "3.12.12"
ruby = "4.0.5"
sbt = "1.9.7"
scala = "2.13.12"
terraform = "1.9.8"

[settings]
# Honor .python-version / .ruby-version files everywhere (replaces pyenv/rbenv).
# Off by default in mise.
idiomatic_version_file_enable_tools = ["python", "ruby"]
