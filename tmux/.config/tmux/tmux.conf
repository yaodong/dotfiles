# Remap prefix from C-b to C-j (matching old config)
unbind C-b
set -g prefix C-j
bind C-j send-prefix

# True color and undercurl support
set -g default-terminal "tmux-256color"
set -as terminal-features ',*:RGB:usstyle'
set -as terminal-overrides ',*:Smulx=\E[4::%p1%dm'
set -as terminal-overrides ',*:Setulc=\E[58::2::%p1%{65536}%/%d::%p1%{256}%/%{255}%&%d::%p1%{255}%&%d%;m'

# Forward modified keys, including Shift+Enter, to terminal TUIs.
set -s extended-keys always
set -s extended-keys-format csi-u
set -as terminal-features ',xterm*:extkeys'

# General settings
set -g mouse on
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g escape-time 0
set -g history-limit 10000
set -g repeat-time 1000
set -g focus-events on
set -g set-clipboard on
set -g allow-rename off
set -g allow-passthrough on

# Vi mode for copy
setw -g mode-keys vi
set -g mode-style "fg=black,bg=brightwhite"
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel

# Split panes with | and -
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# New windows in current path
bind c new-window -c "#{pane_current_path}"

# Quick window toggle
bind Space last-window

# Pane navigation with vim keys
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
bind o select-pane -t :.+
bind -n M-1 select-pane -t :.1
bind -n M-2 select-pane -t :.2
bind -n M-3 select-pane -t :.3
bind -n M-4 select-pane -t :.4
bind -n M-5 select-pane -t :.5
bind -n M-6 select-pane -t :.6
bind -n M-7 select-pane -t :.7
bind -n M-8 select-pane -t :.8
bind -n M-9 select-pane -t :.9

# Pane resizing
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Reload config
bind r source-file ~/.config/tmux/tmux.conf \; display "Config reloaded"

# Plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-pain-control'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'tmux-plugins/tmux-open'
set -g @plugin 'tmux-plugins/tmux-battery'

# Use text-like Nerd Font battery glyphs without coupling status layout to a theme.
set -g @batt_icon_charge_tier8 "󰁹"
set -g @batt_icon_charge_tier7 "󰂁"
set -g @batt_icon_charge_tier6 "󰁿"
set -g @batt_icon_charge_tier5 "󰁾"
set -g @batt_icon_charge_tier4 "󰁽"
set -g @batt_icon_charge_tier3 "󰁼"
set -g @batt_icon_charge_tier2 "󰁻"
set -g @batt_icon_charge_tier1 "󰁺"
set -g @batt_icon_status_charged "󰚥"
set -g @batt_icon_status_charging "󰂄"
set -g @batt_icon_status_discharging "󰂃"
set -g @batt_icon_status_unknown "󰂑"
set -g @batt_icon_status_attached "󱈑"

# Status bar — uses ANSI-named colors so it follows Ghostty light/dark.
set -g status-position bottom
set -g status-style "fg=default,bg=default"
set -g status-left ''
set -g status-left-length 100
set -g status-right-length 150
# Use only ANSI colors that keep readable contrast in both Ghostty themes.
# Window segments use separate number/name blocks without theme coupling.
set -g window-status-format "#[fg=black,bg=brightblack,bold] #I #[fg=brightblack,bg=black,nobold] #W #[default]"
set -g window-status-current-format "#[fg=black,bg=cyan,bold] #I #[fg=white,bg=black,nobold] #W #[default]"
set -g window-status-separator " "
set -g window-style "fg=brightblack,bg=default"
set -g window-active-style "fg=terminal,bg=terminal"
set -g pane-border-lines single
set -g pane-border-style "fg=brightblack"
set -g pane-active-border-style "fg=cyan,bold"
set -g pane-border-status bottom
set -g pane-border-format " #P #{pane_current_command} "

# Nudge Neovim to re-read macOS appearance on focus and session change.
set-hook -g client-focus-in "run-shell '[ -x ~/.local/bin/theme-sync ] && ~/.local/bin/theme-sync'"
set-hook -g client-session-changed "run-shell '[ -x ~/.local/bin/theme-sync ] && ~/.local/bin/theme-sync'"

# Initialize TMUX plugin manager
run '~/.config/tmux/plugins/tpm/tpm'

# Status right (after TPM so battery format strings are available).
set -g status-right '#[fg=brightblack] #[bold]#S#[nobold]#{?#{e|<:#{client_width},120},, · #{battery_icon} #{battery_percentage} · 󰃰 %m/%d %H:%M}'
run '~/.config/tmux/plugins/tmux-battery/battery.tmux'

# Sync Neovim with the current macOS appearance after plugins initialize.
run-shell '[ -x ~/.local/bin/theme-sync ] && ~/.local/bin/theme-sync'
