# Remap prefix from C-b to C-j (matching old config)
unbind C-b
set -g prefix C-j
bind C-j send-prefix

# True color and undercurl support
set -g default-terminal "tmux-256color"
set -as terminal-features ',*:RGB:usstyle'
set -as terminal-overrides ',*:Smulx=\E[4::%p1%dm'
set -as terminal-overrides ',*:Setulc=\E[58::2::%p1%{65536}%/%d::%p1%{256}%/%{255}%&%d::%p1%{255}%&%d%;m'

# General settings
set -g mouse on
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g escape-time 0
set -g history-limit 10000
set -g repeat-time 1000
set -g focus-events on
set -g set-clipboard on
set -g allow-rename off
set -g allow-passthrough on

# Vi mode for copy
setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel

# Split panes with | and -
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# New windows in current path
bind c new-window -c "#{pane_current_path}"

# Quick window toggle
bind Space last-window

# Pane navigation with vim keys
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
bind o select-pane -t :.+

# Pane resizing
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Reload config
bind r source-file ~/.config/tmux/tmux.conf \; display "Config reloaded"

# Plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-pain-control'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'tmux-plugins/tmux-open'
set -g @plugin 'tmux-plugins/tmux-battery'
set -g @plugin 'catppuccin/tmux'

# Catppuccin theme
set -g @catppuccin_flavor 'mocha'
set -g @catppuccin_status_background "none"

set -g @catppuccin_window_status_style "basic"
set -g @catppuccin_window_current_left_separator " "
set -g @catppuccin_window_current_middle_separator " "
set -g @catppuccin_window_current_right_separator " "
set -g @catppuccin_window_text " #W"
set -g @catppuccin_window_current_text " #W"
set -g @catppuccin_date_time_text " %m/%d %H:%M"

# Status bar
set -g status-position bottom
set -g status-right-length 150
set -g status-left-length 100
set -g status-left ''
set -g pane-border-status bottom
set -g pane-border-format ""
# Sync app themes from macOS appearance on focus and session change.
set-hook -g client-focus-in "run-shell '[ -x ~/.local/bin/theme-sync ] && ~/.local/bin/theme-sync'"
set-hook -g client-session-changed "run-shell '[ -x ~/.local/bin/theme-sync ] && ~/.local/bin/theme-sync'"

# Initialize TMUX plugin manager
run '~/.config/tmux/plugins/tpm/tpm'

# Status bar (after TPM so catppuccin variables are available for -F expansion)
set -g @plugin_interpolated_options 'status-right status-left @_status_battery'
set -gF @_status_battery "#{E:@catppuccin_status_battery}"
set -g status-right '#{?#{e|<:#{client_width},120},,#{E:@catppuccin_status_session}#{E:@_status_battery}#{E:@catppuccin_status_date_time}}'
run '~/.config/tmux/plugins/tmux-battery/battery.tmux'

# Sync with the current macOS appearance after plugins initialize.
run-shell '[ -x ~/.local/bin/theme-sync ] && ~/.local/bin/theme-sync'
